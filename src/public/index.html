<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Code Agents Web CLI</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Web interface for Claude Code, Codex, and terminal sessions with GitHub OAuth and SQLite persistence">
    <!-- Relay's --background. The inline script below overrides this per
         colourway once settings have loaded; this is the value that paints the
         address bar and the PWA splash before then. -->
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Code Agents">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Code Agents Web CLI">
    <meta name="format-detection" content="telephone=no">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!--
      Icons. Real files under /icons, rasterised from assets/icon.svg at build
      time; they used to be one Express route answering every size and both
      extensions with the same SVG document.

      apple-touch-icon must be a PNG: Safari ignores an SVG here, which is why
      "Add to Home Screen" produced a blank tile. favicon.ico is listed for the
      browsers that request it unasked, and the SVG for those that prefer a
      scalable one.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
    <meta name="msapplication-TileColor" content="#0a0a0a">
    <meta name="msapplication-TileImage" content="/icons/icon-144.png">
    
    <!-- Apply saved theme early to avoid flash -->
    <script>
      (function() {
        try {
          const s = JSON.parse(localStorage.getItem('cc-web-settings') || '{}');
          const themeMap = {
            'github-dark': 'github-dark',
            'github-dark-dimmed': 'github-dark-dimmed',
            'github-dark-high-contrast': 'github-dark-high-contrast',
            'github-light': 'github-light',
            'github-light-high-contrast': 'github-light-high-contrast',
            'github-light-soft': 'github-light',
            dark: 'github-dark',
            light: 'github-light',
            dracula: 'github-dark-dimmed',
            'solarized-dark': 'github-dark-dimmed'
          };
          const theme =
            (s && typeof s.theme === 'string' && themeMap[s.theme]) ||
            (s && typeof s.terminalTheme === 'string' && themeMap[s.terminalTheme]) ||
            'github-dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute(
            'data-color-mode',
            theme.indexOf('github-light') === 0 ? 'light' : 'dark'
          );
        } catch (_) { /* ignore */ }
      })();
    </script>
    <link rel="stylesheet" href="css/relay/relay.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Geist is the Relay UI face; the rest remain selectable terminal fonts.
         Loaded here rather than via the @import in Relay's tokens/fonts.css,
         which would serialise the fetch behind that stylesheet's own parse. -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Geist:wght@100..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/vendor/xterm.css" />
</head>
<body>
    <div id="app">
        <!--
          Every panel, bar, dialog, sheet and toast the app has is rendered by
          the Relay shell into #relayRoot. What is left in this file is the one
          thing React must never own.
        -->
        <div id="relayRoot"></div>

        <!--
          The terminal lives outside the React tree on purpose and is adopted
          into it by TerminalHost. xterm binds its renderer, viewport and
          selection to whatever node it was constructed against, so if React
          created this node, any re-render that unmounted the component would
          take a live session's scrollback and cursor with it. It is created
          once here and never re-created.

          <main class="main"> is the element adopted, not #terminalContainer
          itself: SplitContainer.createSplitElements() looks up '.main' and
          appends its split panes as a sibling of #terminalContainer, then
          toggles between the two. Adopting the child alone leaves '.main'
          outside the shell, and that lookup returns null and silently
          early-returns — split view simply stops existing, with no error.
        -->
        <main class="main">
            <div class="terminal-container" id="terminalContainer" data-view="single">
                <div class="terminal-wrapper">
                    <div id="terminal"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.bundle.js"></script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful:', registration.scope);
                        
                        // Check for updates periodically
                        setInterval(() => {
                            registration.update();
                        }, 60000); // Check every minute
                        
                        // Handle updates
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New service worker available, prompt user to refresh
                                    if (confirm('A new version of Code Agents Web CLI is available. Refresh to update?')) {
                                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                                        window.location.reload();
                                    }
                                }
                            });
                        });
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed:', err);
                    });
            });
        }
    </script>
</body>
</html>
