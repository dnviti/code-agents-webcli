name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor the package declares (the first release with an
        # unflagged node:sqlite); 24 is current LTS.
        node:
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  install:
    name: Verify the documented install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Deliberately runs on a clean runner with no node_modules and no
      # pre-approved install scripts, which is the only place the promise in the
      # README can actually be falsified. It installs the working tree by git
      # URL into an empty prefix and starts the result. A dependency that needs
      # to compile, or a `prepare` that only works inside a checkout, fails
      # here and nowhere else.
      - name: Install from a git URL into an empty prefix
        run: bash scripts/verify-install.sh

  docker-build:
    name: Validate Docker build
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No build-args here on purpose. This job only proves the image builds,
      # and on a pull_request `github.sha` is the ephemeral merge commit, which
      # is not on main — baking it would produce an image whose update check
      # asks GitHub about a commit that 404s.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          platforms: linux/amd64
          tags: code-agents-webcli:ci
