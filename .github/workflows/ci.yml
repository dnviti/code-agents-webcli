name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24.16 is the package floor: it supplies node:sqlite serialize and
        # deserialize, which the macOS workspace backend requires. Test both
        # that exact floor and the current 24.x LTS line.
        node:
          - '24.16'
          - '24'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ubuntu's AppArmor policy disables Chromium's unprivileged-user-
      # namespace fallback. Keep the real Electron renderer test sandboxed by
      # configuring the helper exactly as Chromium requires.
      - name: Configure Electron sandbox helper
        shell: bash
        run: bash scripts/ci/configure-ci-electron-sandbox.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:strict

      # Whole classes of defect here are invisible to the unit suite because
      # only a layout engine can answer them: whether a bar wraps, whether an
      # answer actually reaches the screen while it streams. The runner image
      # ships Chrome, and the explicit strict command refuses to skip.
      - name: Browser checks
        run: npm run test:browser:strict

  install:
    name: Verify the documented install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Deliberately runs on a clean runner with no node_modules and no
      # pre-approved install scripts, which is the only place the promise in the
      # README can actually be falsified. It installs the working tree by git
      # URL into an empty prefix and starts the result. A dependency that needs
      # to compile, or a `prepare` that only works inside a checkout, fails
      # here and nowhere else.
      - name: Install from a git URL into an empty prefix
        run: bash scripts/release/verify-install.sh

  docker-build:
    name: Validate Docker build
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No build-args here on purpose. This job only proves the image builds,
      # and on a pull_request `github.sha` is the ephemeral merge commit, which
      # is not on main — baking it would produce an image whose update check
      # asks GitHub about a commit that 404s.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          platforms: linux/amd64
          tags: code-agents-webcli:ci

  linux-packages:
    name: Build Debian and RPM packages
    runs-on: ubuntu-24.04
    needs: verify
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install packaging tooling
        run: |
          sudo apt-get update
          # deb needs fakeroot; rpm shells out to `rpmbuild` (the `rpm` package).
          sudo apt-get install --yes fakeroot rpm

      - name: Install dependencies
        run: npm ci

      - name: Build the Debian package
        run: npm run desktop:dist:linux:deb

      - name: Build the RPM package
        run: npm run desktop:dist:linux:rpm

      - name: Verify both packages were produced
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -e 'process.stdout.write(require("./package.json").version)')"
          test -f "release/Code-Agents-Web-CLI-${version}-linux-x64.deb"
          test -f "release/Code-Agents-Web-CLI-${version}-linux-x64.rpm"
          echo "deb and rpm for ${version} produced."

  native-packaged-smoke:
    name: Unsigned packaged smoke (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            package: npm run desktop:dist:win:unsigned
            helper_marker: WORKSPACE_ENTRY_HELPER_OK app.asar
          - os: macos-15-intel
            label: macOS x64
            package: npm run desktop:dist:mac:x64:unsigned
            helper_marker: WORKSPACE_ENTRY_HELPER_OK app.asar
          - os: macos-15
            label: macOS arm64
            package: npm run desktop:dist:mac:arm64:unsigned
            helper_marker: WORKSPACE_ENTRY_HELPER_OK app.asar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16'
          cache: npm
      - run: npm ci
      - name: Exercise the native workspace helper and serialized database
        shell: bash
        run: npm run test:strict -- --test-file test/workspace-portable-storage.test.js --test-file test/sqlite-adapter.test.js
      - name: Build explicitly unsigned native package
        shell: bash
        run: ${{ matrix.package }}
      - name: Smoke the packaged application
        shell: bash
        timeout-minutes: 20
        env:
          CODE_AGENTS_WEBCLI_DESKTOP_SMOKE: '1'
        run: |
          set -euo pipefail
          if [ '${{ runner.os }}' = 'Windows' ]; then
            executable='release/win-unpacked/code-agents-webcli.exe'
          else
            executable="$(find release -type f -path '*/Code Agents Web CLI.app/Contents/MacOS/Code Agents Web CLI' -print -quit)"
          fi
          test -n "$executable"
          test -f "$executable"
          output="$("$executable")"
          printf '%s\n' "$output"
          grep -F 'DESKTOP_WORKSPACE_ATTACHMENT_SMOKE_OK' <<<"$output"
          grep -F 'DESKTOP_PACKAGED_RENDERER_SMOKE_OK' <<<"$output"
          grep -F 'DESKTOP_SMOKE_OK' <<<"$output"
          if [ -n '${{ matrix.helper_marker }}' ]; then
            grep -F '${{ matrix.helper_marker }}' <<<"$output"
          fi
