name: Release On Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

# This project is distributed from git and as a container image, not via npm.
# Publishing to npm was removed: the package has never existed on the registry,
# and trusted publishing cannot bootstrap one, so `npm publish` 404'd on every
# run -- taking the tag, the release and the Docker push down with it, since
# they are later steps in the same job.
permissions:
  contents: write
  packages: write

concurrency:
  group: release-on-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Tag, release and publish the Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Read package version
        id: pkg
        run: |
          VERSION="$(node -e 'process.stdout.write(require("./package.json").version)')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if git tag already exists
        id: git-tag
        run: |
          git fetch --tags --force --quiet
          if git rev-parse -q --verify "refs/tags/v${{ steps.pkg.outputs.version }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.git-tag.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker metadata
        if: steps.git-tag.outputs.exists == 'false'
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.pkg.outputs.version }}
            type=raw,value=v${{ steps.pkg.outputs.version }}

      - name: Build and push Docker image
        if: steps.git-tag.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          # The image has no .git, so the commit it was built from has to be
          # passed in or the container cannot report its own version.
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Create GitHub release
        if: steps.git-tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: v${{ steps.pkg.outputs.version }}
          body: |
            Automated release for v${{ steps.pkg.outputs.version }}.

            Published assets:
            - container image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}`

            Run it without installing:
            ```
            npx --allow-git=all github:dnviti/code-agents-webcli
            ```

            Or install it:
            ```
            npm i -g --allow-git=all github:dnviti/code-agents-webcli
            cc-web
            ```

            Needs Node 22.13 or newer. Nothing is compiled and there is no
            second command: the `npm rebuild` step that used to be here went
            away with the last native dependency.
