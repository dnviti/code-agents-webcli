name: Release On Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-on-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify and read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      tag_exists: ${{ steps.git-tag.outputs.exists }}
      tag_target: ${{ steps.git-tag.outputs.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Read package version
        id: pkg
        run: |
          VERSION="$(node -e 'process.stdout.write(require("./package.json").version)')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if git tag already exists
        id: git-tag
        run: |
          git fetch --tags --force --quiet
          if git rev-parse -q --verify "refs/tags/v${{ steps.pkg.outputs.version }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "target=$(git rev-list -n 1 "v${{ steps.pkg.outputs.version }}")" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "target=" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse an unsafe release ref or reused version
        shell: bash
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Releases may only run from the main branch; got ${{ github.ref }}." >&2
            exit 1
          fi
          if [ "${{ steps.git-tag.outputs.exists }}" = "true" ] \
            && [ "${{ steps.git-tag.outputs.target }}" != "${{ github.sha }}" ]; then
            echo "v${{ steps.pkg.outputs.version }} already points to another commit; bump package.json before releasing." >&2
            exit 1
          fi

  docker:
    name: Publish Docker image
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # A tag means this version was already published.  Keep a rerun from
      # changing its container image while allowing the release job below to
      # repair a missing or partial set of desktop assets.
      - name: Log in to GitHub Container Registry
        if: needs.verify.outputs.tag_exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker metadata
        if: needs.verify.outputs.tag_exists == 'false'
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=v${{ needs.verify.outputs.version }}

      - name: Build and push Docker image
        if: needs.verify.outputs.tag_exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

  desktop:
    name: Build desktop (${{ matrix.label }})
    needs: verify
    # A rerun for the tagged commit may repair a failed asset upload.  A later
    # main commit with the same version must not replace assets for that tag.
    if: needs.verify.outputs.tag_exists == 'false' || needs.verify.outputs.tag_target == github.sha
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x64
            args: --linux AppImage flatpak --x64
            required: "*.AppImage *.flatpak"
            package_count: 2
          - os: windows-latest
            label: Windows x64
            args: --win nsis --x64
            required: "*.exe"
            package_count: 1
          # Native runners matter here: @lydell/node-pty is selected by npm for
          # the install host's architecture, so one cross-build job would put
          # the wrong optional native package in one of the DMGs.
          - os: macos-15-intel
            label: macOS x64
            args: --mac dmg --x64
            required: "*.dmg"
            package_count: 1
          - os: macos-15
            label: macOS arm64
            args: --mac dmg --arm64
            required: "*.dmg"
            package_count: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder's Flatpak target requires both tools and its selected
      # Freedesktop runtime/SDK on the Linux build machine.
      - name: Install Flatpak build requirements
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder xvfb xauth
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08

      - name: Build desktop packages
        shell: bash
        run: |
          set -euo pipefail
          npm run desktop:dist -- ${{ matrix.args }}

          for pattern in ${{ matrix.required }}; do
            matches=(release/$pattern)
            if [ "${#matches[@]}" -eq 0 ] || [ ! -e "${matches[0]}" ]; then
              echo "Expected desktop artifact matching release/$pattern was not produced." >&2
              exit 1
            fi
          done
          package_count="$(find release -maxdepth 1 -type f \
            \( -name '*.AppImage' -o -name '*.flatpak' -o -name '*.exe' -o -name '*.dmg' \) \
            | wc -l | tr -d '[:space:]')"
          if [ "$package_count" -ne "${{ matrix.package_count }}" ]; then
            echo "Expected ${{ matrix.package_count }} desktop package(s); found $package_count." >&2
            exit 1
          fi

      - name: Smoke the native packaged application
        shell: bash
        env:
          CODE_AGENTS_WEBCLI_DESKTOP_SMOKE: "1"
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              executable="release/linux-unpacked/code-agents-webcli"
              output="$(xvfb-run -a "$executable")"
              ;;
            Windows)
              executable="release/win-unpacked/code-agents-webcli.exe"
              output="$("$executable")"
              ;;
            macOS)
              executable="$(find release -type f -path '*/Code Agents Web CLI.app/Contents/MacOS/Code Agents Web CLI' -print -quit)"
              if [ -z "$executable" ]; then
                echo "Could not find the packaged macOS executable." >&2
                exit 1
              fi
              output="$("$executable")"
              ;;
          esac
          printf '%s\n' "$output"
          grep -F 'DESKTOP_SMOKE_OK' <<<"$output"

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.flatpak
            release/*.exe
            release/*.dmg

  release:
    name: Attach desktop packages to GitHub release
    needs:
      - verify
      - docker
      - desktop
    runs-on: ubuntu-latest

    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets

      - name: Verify packages and write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          mapfile -t packages < <(find . -type f \( -name '*.AppImage' -o -name '*.flatpak' -o -name '*.exe' -o -name '*.dmg' \) | sort)
          if [ "${#packages[@]}" -ne 5 ]; then
            echo "Expected AppImage, Flatpak, Windows NSIS, and two macOS DMG packages; found ${#packages[@]}." >&2
            printf '%s\n' "${packages[@]}" >&2
            exit 1
          fi
          mkdir published
          declare -A names=()
          for package in "${packages[@]}"; do
            name="$(basename "$package")"
            if [[ -v "names[$name]" ]]; then
              echo "Duplicate published asset name: $name" >&2
              exit 1
            fi
            names["$name"]=1
            cp "$package" "published/$name"
          done
          (
            cd published
            find . -maxdepth 1 -type f \
              \( -name '*.AppImage' -o -name '*.flatpak' -o -name '*.exe' -o -name '*.dmg' \) \
              -printf '%f\0' | sort -z | xargs -0 sha256sum
          ) > SHA256SUMS.tmp
          mv SHA256SUMS.tmp published/SHA256SUMS
          if [ "$(wc -l < published/SHA256SUMS | tr -d '[:space:]')" -ne 5 ]; then
            echo "Expected five checksum entries." >&2
            exit 1
          fi
          (cd published && sha256sum -c SHA256SUMS)

      # This runs only after every required native package exists.  It creates
      # the release on the first run and overwrites matching assets on reruns,
      # so a transient upload failure can be repaired without retagging.
      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: v${{ needs.verify.outputs.version }}
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/published/*.AppImage
            release-assets/published/*.flatpak
            release-assets/published/*.exe
            release-assets/published/*.dmg
            release-assets/published/SHA256SUMS
          body: |
            Automated release for v${{ needs.verify.outputs.version }}.

            Desktop downloads (all are unsigned):
            - `*.AppImage` — Linux x64, portable; make it executable and run it.
            - `*.flatpak` — Linux x64, sandboxed Flatpak bundle.
            - `*.exe` — Windows x64 NSIS installer.
            - `*-x64.dmg` — macOS Intel (x64).
            - `*-arm64.dmg` — macOS Apple Silicon (arm64).
            - `SHA256SUMS` — SHA-256 checksums for every desktop package.

            Windows SmartScreen and macOS Gatekeeper will warn because these
            packages are unsigned. Review the checksum before overriding a
            warning. Release-download updates notify you; installing an update
            is always a manual choice, never a silent automatic update.

            Also published: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}`
